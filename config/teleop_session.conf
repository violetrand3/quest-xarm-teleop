# Settings for scripts/teleop (sourced by bash). Values are the ones verified on the rig on 2026-10-12.
# Lengths in mm, speeds in mm/s, angles in degrees.

LAB_HOST=linux2                        # the machine that talks to the arm, the gripper and the cameras
LAB_DIR=quest-xarm-teleop-dryrun       # our directory there (relative to the home directory)
LAB_STEPPER_STATUS=http://127.0.0.1:8093/api/status   # the lab's own arm program: read-only status page
LAB_CAMERA_STATUS=http://127.0.0.1:8090/api/status    # the lab's camera wall: read-only status page
LAB_MOTION_LOG=/home/dev/robotdash/motion_log.txt     # the lab's log of arm motions and setting changes

# The box the arm may move in, base frame: x_min,x_max,y_min,y_max,z_min,z_max.
# The floor (z_min 240) is 1 cm above where the jaws touched down in the bin on 2026-10-12.
# It must stay FENCE_MARGIN inside the controller's own fence, or the program refuses to start.
BOX_ABS=199,479,-247,260,240,546
FENCE_MARGIN=5

SCALE=0.667          # tool movement per hand movement
V_MAX=120            # fastest the target may move
A_MAX=500
CTRL_SPEED=150       # speed and acceleration limits given to the arm's controller
CTRL_ACC=1500
TRACK_ERR=25         # fault if the target gets further than this from the arm
INPUT_FRESH_MS=400

GRIPPER=1            # index trigger drives the jaws (0 = arm only)
ROTATION=full        # off | yaw | full
ROT_MAX=30           # from the tool's orientation when the session starts
ROT_SPEED=20

# The controller's reduced mode limits the arm to 50 mm/s and 20 deg/s (as set on this rig). The operator
# chose on 2026-10-12 to run teleop with reduced mode OFF. 1 = accept that; 0 = require reduced mode ON
# (then V_MAX, CTRL_SPEED and ROT_SPEED above must be lowered below its limits).
ALLOW_REDUCED_MODE_OFF=1

# Which way the headset's front points while you operate. The arm's directions are worked out from it.
#   0   = the same way you face: lying on the table facing away from you, or worn / pushed up on the forehead
#   180 = at you: lying on the table facing you
# With the wrong value, forward/back and left/right are swapped.
OPERATOR_YAW=0

REQUIRE_CAMERA_PAGE=1   # 1 = wait until the camera page is open before starting (remote operator); 0 = do not wait
MAKE_VIDEOS=1           # 1 = after a recording session, copy the demos to this PC and make view_*.mp4 files on both machines

# A session has no time limit unless you give one ("teleop record 10"). It ends with Ctrl-C, and by itself:
LINK_LOST_END_S=60   # ... when the arm program has had no connection from this PC for this many seconds (PC or network gone)
IDLE_END_MIN=15      # ... when the arm has not followed the hand for this many minutes (0 = never)
DEMO_MAX_MIN=5       # a demo still recording after this many minutes is saved and closed (at most 15)
MIN_FREE_GB=6        # recording needs at least this much free disk on the lab host
RELAY_PORT=28090     # camera relay on the lab host (loopback) and its tunnel on this PC
RELAY_LOCAL_PORT=18091
