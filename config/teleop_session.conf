# Settings for scripts/teleop (sourced by bash). Values are the ones verified on the rig on 2026-10-12.
# Lengths in mm, speeds in mm/s, angles in degrees.

LAB_HOST=linux2                        # the machine that talks to the arm, the gripper and the cameras
LAB_DIR=quest-xarm-teleop-dryrun       # our directory there (relative to the home directory)
LAB_STEPPER_STATUS=http://127.0.0.1:8093/api/status   # the lab's own arm program: read-only status page
LAB_CAMERA_STATUS=http://127.0.0.1:8090/api/status    # the lab's camera wall: read-only status page
LAB_MOTION_LOG=/home/dev/robotdash/motion_log.txt     # the lab's log of arm motions and setting changes

# The box the arm may move in, base frame, mm: x_min,x_max,y_min,y_max,z_min,z_max. A side given as "fence" is always
# FENCE_MARGIN inside the controller's fence, so it follows the lab's changes by itself.
# At start each side is cut back to FENCE_MARGIN inside the controller's own fence, and the box is stretched to take in
# an arm left up to 50 mm outside it (never below the floor); the console prints "box fitted: ..." when it does.
# The floor follows the fence, which the lab sets for the trays (216 on 2026-10-31, so the floor is 221). It limits the
# flange, not the jaw tips: the lab's probe (2026-10-27) found the jaw tips a few mm above the tray floor with the flange
# at z 236 tilted 25 deg, and pressing in at z 212..217 gave collision error 31. Go down gently near the tray.
BOX_ABS=199,479,-247,260,fence,546
FENCE_MARGIN=5

SCALE=0.667          # tool movement per hand movement
V_MAX=120            # fastest the target may move
A_MAX=500
CTRL_SPEED=150       # speed and acceleration limits given to the arm's controller
CTRL_ACC=1500
TRACK_ERR=25         # fault if the target gets further than this from the arm
INPUT_FRESH_MS=400

GRIPPER=1            # index trigger drives the jaws (0 = arm only)
ROTATION=full        # off | yaw | full
TILT_MAX=60          # gripper tilt from pointing straight down, degrees (a start tilted further keeps its own tilt)
TURN_MAX=90          # gripper turn about the vertical, either way from the session's start, degrees (90 covers any direction)
ROT_SPEED=25         # deg/s; the controller turns the tool at about 0.19 deg/s per mm/s of CTRL_SPEED (28 deg/s at 150)

# The controller's reduced mode limits the arm to 50 mm/s and 20 deg/s (as set on this rig). The operator
# chose on 2026-10-12 to run teleop with reduced mode OFF. 1 = accept that; 0 = require reduced mode ON
# (then V_MAX, CTRL_SPEED and ROT_SPEED above must be lowered below its limits).
ALLOW_REDUCED_MODE_OFF=1

# Which way the headset's front points while you operate. The arm's directions are worked out from it.
#   0   = the same way you face: lying on the table facing away from you, or worn / pushed up on the forehead
#   180 = at you: lying on the table facing you
# With the wrong value, forward/back and left/right are swapped.
OPERATOR_YAW=0

REQUIRE_CAMERA_PAGE=1   # 1 = wait until the camera page is open before starting (remote operator); 0 = do not wait
MAKE_VIDEOS=1           # 1 = after a recording session, copy the demos to this PC and make view_*.mp4 files on both machines

# A session has no time limit unless you give one ("teleop record 10"). It ends with Ctrl-C, and by itself:
LINK_LOST_END_S=60   # ... when the arm program has had no connection from this PC for this many seconds (PC or network gone)
IDLE_END_MIN=15      # ... when the arm has not followed the hand for this many minutes (0 = never)
DEMO_MAX_MIN=5       # a demo still recording after this many minutes is saved and closed (at most 15)
MIN_FREE_GB=6        # recording needs at least this much free disk on the lab host

# Cameras on the operator's page (low rate) and in every recorded demo (full rate), by their names on the lab's
# camera wall: iphone (gripper camera), rs_color (RealSense colour, fixed), zed (ZED 2i left eye, fixed), c920, rs_depth.
# The first one must be the gripper camera. Every camera listed must be sending pictures, or a demo will not start.
# zed stopped sending pictures on 2026-10-14 (to be fixed on the lab side); iphone,zed was the setting before that.
CAMERAS=iphone,rs_color
RELAY_PORT=28090     # camera relay on the lab host (loopback) and its tunnel on this PC
RELAY_LOCAL_PORT=18091

# The YAM arms (scripts/teleop yam-sim, yam-try, yam-record; docs/yam_teleop.md)
YAM_SPEED=7.5        # speed level: the tool's top speed in cm/s, one of 7.5, 15, 30, 50. Go up one level at a time
YAM_SCALE=0.667      # tool movement per hand movement (1 = the arm moves as far as your hand)
YAM_VELOCITY_FF=1    # 1 = each command carries its speed, so the motors follow without trailing; 0 = positions only
YAM_FPS=15           # camera pictures a second sent to you (5, 8, 10, 12, 15, 20, 30). The RealSense gives 15; more pictures = more network traffic
YAM_HEADSET=app      # app = watch the cameras on this PC (the headset app reads the controllers); web = the cameras float in
                     # front of you IN the headset: its browser opens a VR page from this PC (docs/yam_teleop.md, "Cameras in the headset")
YAM_STEREO=          # empty = the RealSense as the overview. With YAM_HEADSET=web, the overview in depth in the headset:
                     # depth = a 3D scene built from the RealSense's colour and depth sensor (you look into it; it shifts as
                     #         your head moves); zed = the ZED 2i's two eyes, one for each of yours (the ZED must point at the YAM arms)
                     # depth2 = depth, with the ZED 2i as a second depth camera from the side for what the arms hide (a trial)
YAM_SCENE_MEMORY=0   # 1 = in the 3D scene, behind an arm show what the camera saw there before the arm came in front (a trial); 0 = a guess
